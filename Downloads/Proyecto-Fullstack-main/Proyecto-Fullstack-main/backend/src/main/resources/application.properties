# Perfil por defecto: desarrollo local (puedes sobreescribir con SPRING_PROFILES_ACTIVE=prod en despliegues).
spring.profiles.active=dev
# Cambia el puerto por defecto a 8081 para evitar conflicto con otros servicios (puedes sobreescribir con PORT).
server.port=${PORT:8081}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Usa una clave HMAC de al menos 256 bits (32+ chars) para evitar WeakKeyException
jwt.secret=${JWT_SECRET:rS0q7KNE6JH0A5yY3wuhbY5N7Xg5uZ3Xh8n2UOEVpXg1dV0b4q9mA1pDz3sM0kLc}
jwt.expiration=3600000
