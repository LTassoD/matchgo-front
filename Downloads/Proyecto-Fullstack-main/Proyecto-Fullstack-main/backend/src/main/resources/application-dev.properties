# Perfil de desarrollo local (Laragon MySQL/MariaDB)
spring.datasource.url=${DB_URL_DEV:jdbc:mysql://localhost:3306/appecologica?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME_DEV:admin}
spring.datasource.password=${DB_PASSWORD_DEV:TuPassSegura123!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Las propiedades compartidas (JWT, swagger) se definen en application.properties
