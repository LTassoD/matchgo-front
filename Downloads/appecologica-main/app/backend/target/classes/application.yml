spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/appecologica?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: 8080

jwt:
  # Usa una clave de al menos 32 chars (256 bits) para HMAC-SHA256
  secret: change-this-secret-to-a-very-long-32-characters-minimum-key
  expiration-minutes: 1440
